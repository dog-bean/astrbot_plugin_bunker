<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>防空洞</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, #0a1a17 0%, #05080b 55%, #04070a 100%);
    color: #c8d6e0;
    font-family: "JetBrains Mono", "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
    font-size: 13.5px;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100%; }

  header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; height: 46px;
    border-bottom: 1px solid #12202a;
    background: linear-gradient(#081013, #060a0d);
  }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc97; box-shadow: 0 0 9px #3ddc97;
    align-self: center;
    transition: background .25s, box-shadow .25s;
  }
  .dot.off { background: #7a3b3b; box-shadow: 0 0 9px #7a3b3b; }
  .title { font-size: 15px; font-weight: 600; letter-spacing: 3px; color: #d9f2e8; }
  .sub { font-size: 10px; letter-spacing: 4px; color: #33505d; }
  .meta {
    font-size: 10.5px; color: #3d5765; letter-spacing: .4px;
    max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  main {
    flex: 1 1 auto; overflow-y: auto;
    padding: 16px 16px 6px;
    display: flex; flex-direction: column; gap: 11px;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #16242e; border-radius: 4px; }
  main::-webkit-scrollbar-track { background: transparent; }

  .row { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .row.me { align-items: flex-end; }
  .who { font-size: 10px; color: #3f5c6b; letter-spacing: 1px; padding: 0 3px; }
  .bubble {
    max-width: 78%;
    padding: 8px 12px;
    border-radius: 10px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13.5px;
  }
  .row.them .bubble {
    background: #0d151b; border: 1px solid #182630;
    color: #ccd9e2; border-top-left-radius: 3px;
  }
  .row.me .bubble {
    background: linear-gradient(#0f2f28, #0b241e);
    border: 1px solid #1e5c4b;
    color: #b7f0dc; border-top-right-radius: 3px;
  }
  .sys {
    align-self: center; font-size: 11px; color: #4a5e6b;
    text-align: center; max-width: 88%; padding: 2px 0;
  }
  .sys.warn { color: #a8875f; }
  .sys.err { color: #b9706f; }

  .typing { display: flex; gap: 4px; padding: 11px 13px; }
  .typing i {
    width: 5px; height: 5px; border-radius: 50%; background: #3fae8c;
    animation: blink 1.15s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .22; } 35% { opacity: 1; } }

  footer {
    flex: 0 0 auto;
    display: flex; gap: 9px; align-items: flex-end;
    padding: 10px 14px 12px;
    border-top: 1px solid #12202a;
    background: linear-gradient(#070c10, #050809);
  }
  textarea {
    flex: 1 1 auto;
    resize: none;
    min-height: 38px; max-height: 132px;
    padding: 9px 12px;
    background: #0a1015;
    border: 1px solid #17242e;
    border-radius: 9px;
    color: #d6e6ef;
    font-family: inherit; font-size: 13.5px; line-height: 1.5;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  textarea:focus { border-color: #1f6a56; box-shadow: 0 0 0 1px #14503f inset; }
  textarea::placeholder { color: #3a4d59; }
  button {
    flex: 0 0 auto;
    height: 38px; padding: 0 17px;
    border-radius: 9px;
    border: 1px solid #1f6a56;
    background: linear-gradient(#123f34, #0d2e27);
    color: #9ff0d4;
    font-family: inherit; font-size: 13px; letter-spacing: 1px;
    cursor: pointer;
    transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.22); }
  button:disabled { opacity: .42; cursor: default; }
  .ghost {
    background: transparent; border-color: #1b2831; color: #4f6773;
    padding: 0 12px; font-size: 12px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dot off" id="dot"></span>
      <span class="title">防空洞</span>
      <span class="sub">BUNKER</span>
    </div>
    <div class="meta" id="meta">连接中…</div>
  </header>

  <main id="log"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="说点什么，回车发送，Shift+回车换行"></textarea>
    <button class="ghost" id="clear" title="清屏">清屏</button>
    <button id="send">发送</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  const PLUGIN = "astrbot_plugin_bunker";
  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");
  const dotEl = document.getElementById("dot");
  const metaEl = document.getElementById("meta");

  let view = null;
  let lastId = 0;
  let busy = false;
  let senderName = "用户";
  let botName = "鲸鲸";
  let rendered = new Set();
  let typingEl = null;
  let pollTimer = null;

  // ---------- 通道 ----------

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function findView() {
    for (let i = 0; i < 60; i += 1) {
      let cand = window.AstrBotPluginView || window.AstrBotPluginPage;
      if (!cand) {
        try { cand = window.parent.AstrBotPluginView || window.parent.AstrBotPluginPage; } catch (e) { cand = null; }
      }
      if (cand && typeof cand.apiGet === "function") {
        if (typeof cand.ready === "function") { try { await cand.ready(); } catch (e) {} }
        return cand;
      }
      await sleep(100);
    }
    return null;
  }

  function pick(res) {
    if (res && typeof res === "object" && res.data && typeof res.data === "object") {
      if ("ok" in res.data || "messages" in res.data) return res.data;
    }
    return res;
  }

  async function apiGet(endpoint, params) {
    if (view) {
      return pick(await view.apiGet(endpoint, params || {}));
    }
    const qs = new URLSearchParams(params || {}).toString();
    const url = "/api/plugins/extensions/" + PLUGIN + "/" + endpoint + (qs ? "?" + qs : "");
    const r = await fetch(url, { credentials: "include" });
    return pick(await r.json());
  }

  async function apiPost(endpoint, body) {
    if (view) {
      return pick(await view.apiPost(endpoint, body || {}));
    }
    const r = await fetch("/api/plugins/extensions/" + PLUGIN + "/" + endpoint, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return pick(await r.json());
  }

  // ---------- 渲染 ----------

  function setOnline(on) {
    dotEl.classList.toggle("off", !on);
  }

  function timeOf(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    const p = (n) => String(n).padStart(2, "0");
    return p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function scrollDown() {
    logEl.scrollTop = logEl.scrollHeight;
  }

  function addSys(text, kind) {
    const div = document.createElement("div");
    div.className = "sys" + (kind ? " " + kind : "");
    div.textContent = text;
    logEl.appendChild(div);
    scrollDown();
  }

  function renderMessage(msg) {
    if (!msg) return;
    const id = Number(msg.id || 0);
    if (id && rendered.has(id)) return;
    if (id) { rendered.add(id); if (id > lastId) lastId = id; }

    if (msg.role === "system") { addSys(msg.text, "warn"); return; }

    const mine = msg.role === "user";
    const row = document.createElement("div");
    row.className = "row " + (mine ? "me" : "them");

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = (mine ? "我" : botName) + "  " + timeOf(msg.ts);

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.text;

    row.appendChild(who);
    row.appendChild(bubble);
    logEl.appendChild(row);
    scrollDown();
  }

  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement("div");
    typingEl.className = "row them";
    const b = document.createElement("div");
    b.className = "bubble typing";
    b.innerHTML = "<i></i><i></i><i></i>";
    typingEl.appendChild(b);
    logEl.appendChild(typingEl);
    scrollDown();
  }

  function hideTyping() {
    if (!typingEl) return;
    typingEl.remove();
    typingEl = null;
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 132) + "px";
  }

  // ---------- 行为 ----------

  async function bootstrap() {
    view = await findView();
    try {
      const st = await apiGet("page/api/state");
      if (!st || st.ok !== true) throw new Error((st && st.message) || "状态获取失败");
      senderName = st.sender_name || senderName;
      botName = st.bot_name || botName;
      metaEl.textContent = st.umo + "  ·  " + (st.timeout || 180) + "s";
      setOnline(true);
      logEl.innerHTML = "";
      rendered.clear();
      lastId = 0;
      (st.messages || []).forEach(renderMessage);
      if (!st.messages || !st.messages.length) {
        addSys("通道已打开，这条会话和 QQ 那边是同一个。");
      }
      startPolling();
    } catch (e) {
      setOnline(false);
      metaEl.textContent = "连不上：" + (e && e.message ? e.message : "未知错误");
      addSys("通道没打开，" + (e && e.message ? e.message : "未知错误"), "err");
    }
  }

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await apiGet("page/api/poll", { after: String(lastId) });
        if (!res || res.ok !== true) return;
        setOnline(true);
        (res.messages || []).forEach(renderMessage);
      } catch (e) {
        setOnline(false);
      }
    }, 5000);
  }

  async function doSend() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    inputEl.value = "";
    autoGrow();
    busy = true;
    sendBtn.disabled = true;

    // 本地先显示自己这句
    const now = Math.floor(Date.now() / 1000);
    const ghostMsg = { id: 0, role: "user", text: text, ts: now };
    const mineRow = document.createElement("div");
    mineRow.className = "row me";
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = "我  " + timeOf(now);
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    mineRow.appendChild(who);
    mineRow.appendChild(bubble);
    logEl.appendChild(mineRow);
    scrollDown();
    showTyping();

    try {
      const res = await apiPost("page/api/send", { text: text });
      hideTyping();
      if (!res || res.ok !== true) {
        throw new Error((res && (res.message || res.error)) || "发送失败");
      }
      const uid = Number((res.user && res.user.id) || 0);
      if (uid) {
        if (rendered.has(uid)) {
          // 轮询抢先渲染过这条了，删掉本地占位，否则同一条会显示两次
          mineRow.remove();
        } else {
          rendered.add(uid);
          if (uid > lastId) lastId = uid;
        }
      }
      (res.messages || []).forEach(renderMessage);
      if (res.timed_out && !(res.replies && res.replies.length)) {
        addSys("没等到回复。可能它把话发到 QQ 那边去了。", "warn");
      }
    } catch (e) {
      hideTyping();
      addSys("发不出去：" + (e && e.message ? e.message : "未知错误"), "err");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  inputEl.addEventListener("input", autoGrow);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      doSend();
    }
  });
  sendBtn.addEventListener("click", doSend);

  clearBtn.addEventListener("click", async () => {
    try {
      await apiPost("page/api/clear", {});
      logEl.innerHTML = "";
      rendered.clear();
      lastId = 0;
      addSys("已清屏。模型那边的上下文没动。");
    } catch (e) {
      addSys("清屏失败", "err");
    }
  });

  bootstrap();
})();
</script>
</body>
</html>
